# Nova versão do app (EAS Build): gera os instaladores na nuvem da Expo e,
# se marcado, envia para a App Store / Google Play (EAS Submit).
# Use quando a mudança for nativa (permissão nova, biblioteca nativa, versão
# do Expo, ícone, nome) — o resto sai como atualização rápida.
#
# Actions → "App — build" → Run workflow.
name: App — build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Perfil
        type: choice
        options: [preview, production]
        default: preview
      platform:
        description: Plataforma
        type: choice
        options: [all, ios, android]
        default: all
      submit:
        description: Enviar para as lojas ao terminar (só production)
        type: boolean
        default: false

jobs:
  build:
    name: Build ${{ inputs.profile }} (${{ inputs.platform }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.profile }}
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Sem EXPO_TOKEN configurado
        if: env.EXPO_TOKEN == ''
        run: |
          echo "::error::Configure o segredo EXPO_TOKEN no GitHub antes de gerar builds."
          exit 1

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # --no-wait: o build roda na nuvem da Expo; acompanhe em expo.dev
      - name: Iniciar build
        working-directory: apps/mobile
        run: |
          ARGS="--profile ${{ inputs.profile }} --platform ${{ inputs.platform }} --non-interactive --no-wait"
          if [ "${{ inputs.submit }}" = "true" ] && [ "${{ inputs.profile }}" = "production" ]; then
            ARGS="$ARGS --auto-submit"
          fi
          eas build $ARGS
